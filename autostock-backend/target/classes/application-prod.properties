# Les 3 variables ci-dessous sont fournies par le service PostgreSQL de
# Render : à définir dans l'onglet "Environment" du Web Service Render,
# pas dans ce fichier (aucun secret ne doit être committé).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update suffit pour ce projet minimal ; validate serait plus strict si
# le schéma était géré par des migrations (Flyway/Liquibase), hors périmètre ici.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL publique du Static Site Angular une fois déployé sur Render.
cors.allowed-origins=${FRONTEND_URL}
