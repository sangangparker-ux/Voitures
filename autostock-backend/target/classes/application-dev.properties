# Base H2 en mémoire : rapide pour développer, mais toutes les données
# sont perdues à chaque redémarrage. Ne JAMAIS utiliser ce profil en prod.
spring.datasource.url=jdbc:h2:mem:autostockdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update : Hibernate adapte le schéma automatiquement, pratique en dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Origine du frontend Angular servi en local par "ng serve".
cors.allowed-origins=http://localhost:4200
